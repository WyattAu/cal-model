name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@e23c50cf289f55bbb91001c91bbac7de018c11c3 # main @ 2026-10-03
    with:
      tier: a
      all-features: true
      miri: true
      miri-flags: -Zmiri-disable-isolation

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: fuzz smoke — cal_parse (30 s, fleet §4)
        run: cargo fuzz run cal_parse -- -max_total_time=30

  example-smoke:
    # The example is documentation that runs; prove it still does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: calibrate example (embedded project)
        run: cargo run --example calibrate
      - name: calibrate example (files + diff report)
        run: cargo run --example calibrate -- data/powertrain.a2l data/powertrain.dbc
